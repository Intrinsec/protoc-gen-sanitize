version: 2

# No `before.hooks`: the plugin binary builds straight from the vendored
# module tree (`-mod=vendor`); the `make generate` step only produces
# test fixtures unused by the released artifact, and `go mod tidy` risks
# dirtying the git tree, which would abort `goreleaser release --clean`.

builds:
  - id: protoc-gen-sanitize
    main: ./
    binary: protoc-gen-sanitize
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=vendor
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: archive
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: binary
    format: binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --output-signature
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sig"

sboms:
  - artifacts: archive
    documents:
      - "sbom_{{ .Os }}_{{ .Arch }}.cdx.json"

release:
  draft: false
  prerelease: auto
